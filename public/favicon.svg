<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e44" />
      <stop offset="1" stop-color="#1b1d20" />
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5ef" />
      <stop offset="0.45" stop-color="#d6d2c8" />
      <stop offset="0.5" stop-color="#9e9b94" />
      <stop offset="1" stop-color="#e2ded5" />
    </linearGradient>
  </defs>
  <!-- Anodised console panel -->
  <rect width="64" height="64" rx="14" fill="url(#plate)" />
  <!-- Fader slot -->
  <rect x="28" y="8" width="8" height="48" rx="4" fill="#07080a" />
  <!-- Level LEDs either side -->
  <g fill="#57f2d6">
    <rect x="12" y="38" width="9" height="4" rx="1.5" />
    <rect x="12" y="31" width="9" height="4" rx="1.5" opacity="0.85" />
    <rect x="12" y="24" width="9" height="4" rx="1.5" opacity="0.6" />
    <rect x="43" y="38" width="9" height="4" rx="1.5" />
    <rect x="43" y="31" width="9" height="4" rx="1.5" opacity="0.85" />
  </g>
  <rect x="12" y="17" width="9" height="4" rx="1.5" fill="#e0261b" />
  <!-- Fader cap with its red index line (the splice) -->
  <rect x="17" y="27" width="30" height="16" rx="3" fill="url(#cap)" stroke="#000" stroke-opacity="0.35" />
  <rect x="19" y="34" width="26" height="2.4" rx="1" fill="#d8432f" />
</svg>
