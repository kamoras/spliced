<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spliced: a daily music puzzle</title>
    <meta
      name="description"
      content="A daily music puzzle: four mystery songs, chopped into clips and shuffled together. Sort them by ear and rebuild every track."
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f6f7fb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0c0e15"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spliced: a daily music puzzle" />
    <meta
      property="og:description"
      content="Four mystery songs, spliced and shuffled. Rebuild them by ear. A new mix every day."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spliced: a daily music puzzle" />
    <meta
      name="twitter:description"
      content="Four mystery songs, spliced and shuffled. Rebuild them by ear. A new mix every day."
    />

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="7a72c419-9031-42bf-aac3-96f4a559a921"
    ></script>

    <!-- Apply the saved theme before paint to avoid a flash of the wrong one. -->
    <script>
      try {
        var t = localStorage.getItem('spliced:theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
