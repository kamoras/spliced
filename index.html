<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spliced: a daily music puzzle on an 80s mixing desk</title>
    <meta
      name="description"
      content="Spliced is a free daily music puzzle. Three mystery songs are cut into clips and shuffled across an 80s mixing console. Sort them by ear, rebuild every track, and race your friends."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Spliced" />
    <meta name="apple-mobile-web-app-title" content="Spliced" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#bfb6a2"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0d0f11"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spliced" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Spliced: a daily music puzzle" />
    <meta
      property="og:description"
      content="Three mystery songs, spliced and shuffled across an 80s mixing desk. Rebuild them by ear. A new mix every day."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Spliced logo beside a mixing console with year-labelled channels of song clips."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spliced: a daily music puzzle" />
    <meta
      name="twitter:description"
      content="Three mystery songs, spliced and shuffled across an 80s mixing desk. Rebuild them by ear. A new mix every day."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta
      name="twitter:image:alt"
      content="The Spliced logo beside a mixing console with year-labelled channels of song clips."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Spliced",
        "url": "%SITE_URL%/",
        "description": "A free daily music puzzle: three mystery songs are cut into clips and shuffled across an 80s mixing console. Sort them by ear and rebuild every track.",
        "applicationCategory": "GameApplication",
        "genre": ["Puzzle", "Music"],
        "operatingSystem": "Any (web browser)",
        "isAccessibleForFree": true,
        "inLanguage": "en",
        "image": "%SITE_URL%/og.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="7a72c419-9031-42bf-aac3-96f4a559a921"
    ></script>

    <!-- Apply the saved theme before paint to avoid a flash of the wrong one. -->
    <script>
      try {
        var t = localStorage.getItem('spliced:theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Spliced: a daily music puzzle</h1>
      <p>
        Three mystery songs are cut into clips and shuffled across an 80s mixing
        console. Listen, swap and splice each song back onto its channel, then
        share your mix. Spliced needs JavaScript and Web Audio to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
